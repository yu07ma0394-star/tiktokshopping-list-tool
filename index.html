<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発送リスト作成ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
<style>
  :root{
    --blue:#2b6cb0; --blue-l:#d5e5f5; --blue-xl:#f4f8fc;
    --gray:#666; --line:#bcbcbc; --bg:#f5f6f8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    margin:0; background:var(--bg); color:#222; font-size:14px;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:20px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--gray); font-size:13px; margin-bottom:16px;}
  .panel{
    background:#fff; border:1px solid #e2e2e2; border-radius:10px;
    padding:18px; margin-bottom:18px;
  }
  .drop{
    border:2px dashed var(--blue); border-radius:10px; padding:28px;
    text-align:center; background:#fafcff; cursor:pointer; transition:.15s;
  }
  .drop.hover{background:var(--blue-l);}
  .drop b{color:var(--blue);}
  .drop small{display:block; color:var(--gray); margin-top:6px;}
  #fileInput{display:none;}
  .files{margin-top:12px; font-size:13px;}
  .files .f{display:inline-flex; align-items:center; gap:6px; background:var(--blue-xl);
    border:1px solid var(--blue-l); border-radius:20px; padding:4px 12px; margin:3px 4px 0 0;}
  .files .f button{border:none; background:none; color:var(--gray); cursor:pointer; font-size:15px; line-height:1;}
  .controls{display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin-top:14px;}
  .controls label{font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer;}
  .btns{margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;}
  button.act{
    background:var(--blue); color:#fff; border:none; border-radius:8px;
    padding:10px 20px; font-size:14px; cursor:pointer; font-weight:bold;
  }
  button.act.ghost{background:#fff; color:var(--blue); border:1.5px solid var(--blue);}
  button.act:disabled{background:#bbb; cursor:not-allowed;}
  .meta{font-size:13px; color:var(--gray); margin:4px 0 12px;}
  .fmtbox{margin-top:16px; padding-top:14px; border-top:1px dashed #d5d5d5;}
  .fmttitle{font-size:13px; font-weight:bold; color:var(--blue); margin-bottom:2px;}
  .fmtbox .controls{margin-top:8px; gap:14px;}
  .fmtbox select{padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:#fff;}
  .fmtnote{font-size:12px; color:var(--gray); margin-top:8px; line-height:1.6;}
  .fmtwarn{margin-top:10px; padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.7;
    background:#fff7e6; border:1px solid #f0c36d; color:#7a5200;}
  .fmtwarn.ok{background:#eefaf1; border-color:#8fce9f; color:#1f6b38;}
  .fmtwarn b{display:block; margin-bottom:4px;}
  table{border-collapse:collapse; width:100%; font-size:12px;}
  th,td{border:1px solid var(--line); padding:4px 6px; vertical-align:middle; text-align:left;}
  thead th{background:var(--blue-l);}
  .sumtbl tbody tr:nth-child(even){background:var(--blue-xl);}
  td.c,th.c{text-align:center;}
  .sumtbl td, .sumtbl th{padding:4px 8px;}
  h2.sec{font-size:14px; margin:18px 0 8px; border-left:5px solid var(--blue); padding-left:8px;}
  .empty{color:var(--gray); text-align:center; padding:30px;}
  .prodname{color:var(--gray); font-size:11px;}
  td.ord{font-variant-numeric:tabular-nums; word-break:break-all; font-size:11px; color:#333;}
  th.trackh{width:110px;}
  td.track{min-width:110px; background:#fff;}
  td.src{font-size:10px; color:var(--gray); width:34px;}
  tbody tr.grp td{border-top:2px solid #8aa9c8;}
  .print-head{display:none;}
  @media print{
    body{background:#fff; font-size:11px;}
    .noprint{display:none !important;}
    .wrap{max-width:none; padding:0;}
    .panel{border:none; padding:0; margin:0;}
    .print-head{display:block; margin-bottom:6px;}
    table{font-size:10px;}
    th,td{padding:2.5px 4px;}
    thead{display:table-header-group;}
    tr{page-break-inside:avoid;}
    @page{size:A4; margin:10mm;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="noprint">
    <h1>発送リスト作成ツール</h1>
    <div class="sub">TikTok Shop の注文エクスポート（Excel / CSV）や Amazon の納品書（PDF）を読み込んで、宛名・住所・商品・個数の一覧を作り、そのまま印刷できます。データはブラウザ内だけで処理され、どこにも送信されません。</div>

    <div class="panel">
      <div class="drop" id="drop">
        <b>ファイルをドラッグ＆ドロップ</b>、またはクリックして選択<br>
        <small>.xlsx / .xls / .csv / .pdf（複数選択・追加読み込みOK）</small>
      </div>
      <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv,.pdf">
      <div class="files" id="fileList"></div>

      <div class="btns">
        <button class="act" id="genBtn" disabled>リストを作成</button>
        <button class="act ghost" id="printBtn" disabled>🖨 印刷 / PDF保存</button>
        <button class="act ghost" id="clearBtn">クリア</button>
      </div>

      <div class="fmtbox">
        <div class="fmttitle">送り状フォーマット出力</div>
        <div class="controls">
          <label>出力形式
            <select id="fmtMode">
              <option value="clickpost">クリックポスト 公式CSV（直接取込）</option>
              <option value="generic">手入力シート貼付用CSV（11列）</option>
            </select>
          </label>
          <label id="methodWrap" style="display:none;">配送方法
            <select id="shipMethod">
              <option>クリックポスト</option>
              <option>佐川急便</option>
            </select>
          </label>
          <label>文字コード
            <select id="csvEnc">
              <option value="sjis">Shift_JIS（クリックポストはこれ）</option>
              <option value="utf8">UTF-8 BOM付き（Excel / スプレッドシート向け）</option>
            </select>
          </label>
          <button class="act" id="fmtBtn" disabled>📄 送り状FMT作成（CSV）</button>
        </div>
        <div class="fmtnote" id="fmtNote"></div>
        <div class="fmtwarn" id="fmtWarn" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="result">
    <div class="empty" id="emptyMsg">ファイルを読み込むとここに一覧が表示されます。</div>
    <div id="output" style="display:none;">
      <div class="print-head">
        <h1 style="font-size:16px;margin:0;">発送リスト（未発送）</h1>
      </div>
      <div class="meta" id="meta"></div>
      <h2 class="sec">■ 商品別 集計</h2>
      <div id="summary"></div>
      <h2 class="sec">■ 発送先一覧</h2>
      <div id="listTable"></div>
    </div>
  </div>

</div>

<script>
const SKU_SHORT = {
  'wo01':'ウィッグオイル 300mL',
  'ri_se01':'姿勢サポーター',
  'ri_se02':'姿勢サポーター',
  'belt01':'メンズベルト',
  'belt02':'メンズベルト',
  'ri_wa01':'二つ折り財布',
  'hp_sh01':'犬用炭酸入浴剤',
  'PB-RIU-FBA-001-L111':'姿勢サポーター', // Amazon
};

// pdf.js のワーカー設定
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

let filesData = []; // {name, rows:[{...}]}
let currentRecs = []; // 直近に作成したリストの明細（送り状FMT出力用）

const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('fileInput');

drop.addEventListener('click', ()=>fileInput.click());
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hover');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hover');}));
drop.addEventListener('drop', ev=>handleFiles(ev.dataTransfer.files));
fileInput.addEventListener('change', ev=>handleFiles(ev.target.files));

$('genBtn').addEventListener('click', render);
$('printBtn').addEventListener('click', ()=>window.print());
$('fmtBtn').addEventListener('click', exportFmt);
$('clearBtn').addEventListener('click', ()=>{
  filesData=[]; currentRecs=[]; renderFileList(); $('output').style.display='none';
  $('emptyMsg').style.display='block'; $('emptyMsg').textContent='ファイルを読み込むとここに一覧が表示されます。';
  $('genBtn').disabled=true; $('printBtn').disabled=true; $('fmtBtn').disabled=true;
  fileInput.value='';
});

// CSVを文字列のまま解析（数値・日付への自動変換をしない）。引用符・改行・エスケープ対応
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // BOM除去
  const rows=[]; let row=[]; let field=''; let inQ=false; let i=0;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function handleFiles(fileList){
  const arr = Array.from(fileList);
  if(!arr.length) return;
  for(const file of arr){
    try{
      const buf = await file.arrayBuffer();
      let rows;
      if(/\.pdf$/i.test(file.name)){
        rows = await parsePDF(buf);
      }else if(/\.csv$/i.test(file.name)){
        const text = new TextDecoder('utf-8').decode(new Uint8Array(buf));
        rows = parseSheet(parseCSV(text));
      }else{
        const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = parseSheet(XLSX.utils.sheet_to_json(ws, {header:1, defval:''}));
      }
      filesData.push({name:file.name, rows});
    }catch(err){
      alert('読み込みエラー: '+file.name+'\n'+err.message);
    }
  }
  renderFileList(); $('genBtn').disabled=false; render();
}

// Amazon 納品書PDF（1ページ＝1注文）を解析
async function parsePDF(buf){
  if(!window.pdfjsLib) throw new Error('PDFライブラリの読み込みに失敗しました');
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const rows=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // 同じ高さ(y)の文字をまとめて1行に、上から下へ並べる
    const map={};
    tc.items.forEach(it=>{
      if(it.str===undefined) return;
      const k=Math.round(it.transform[5]);
      (map[k]=map[k]||[]).push({s:it.str,x:it.transform[4]});
    });
    const lines=Object.keys(map).map(Number).sort((a,b)=>b-a)
      .map(y=>map[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(''))
      .map(s=>s.replace(/　/g,' ').replace(/\s+/g,' ').trim())
      .filter(s=>s);
    const rec=parseAmazonPage(lines);
    if(rec) rows.push(rec);
  }
  return rows;
}

function parseAmazonPage(lines){
  const text=lines.join('\n');
  const om=text.match(/注文番号[:：]\s*([0-9][0-9\-]+)/);
  const order = om ? om[1] : '';
  // 最初に現れる郵便番号（＝上部の宛先ブロック）を基点にする
  let zi=-1, zip='';
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^〒?\s*(\d{3}-?\d{4})$/);
    if(m){ zip=m[1]; zi=i; break; }
  }
  let name='', addrParts=[];
  if(zi>=0){
    for(let j=zi+1;j<lines.length;j++){
      const l=lines[j];
      if(/様\s*$/.test(l)){ name=l.replace(/\s*様\s*$/,'').trim(); break; }
      if(/^(注文日|配送方法|購入者|出品者|注文番号|発送先|お届け先|数量|Amazon)/.test(l)) continue;
      addrParts.push(l);
    }
  }
  const addr=addrParts.join('');
  const skm=text.match(/SKU[:：]\s*([A-Za-z0-9][A-Za-z0-9\-_.]*)/);
  const sku=skm ? skm[1] : '';

  // 商品名と数量：「1 【商品名…】」形式を優先し、【】が無い納品書にも対応
  let pnm = '', qty = '';
  const qm = text.match(/(\d+)\s*【/);
  if(qm){ qty = qm[1]; }
  // 「先頭が数量 + 商品名」の行を探す（郵便番号・注文番号の行は除く）
  const item = lines.find(l=>
    /^(\d{1,3})\s+\S/.test(l) &&
    !/^\d{3}-?\d{4}$/.test(l) &&
    !/注文|SKU|合計|小計|税|円|¥/.test(l)
  );
  if(item){
    const m2 = item.match(/^(\d{1,3})\s+(.+)$/);
    if(m2){ if(!qty) qty = m2[1]; pnm = m2[2].trim(); }
  }
  if(!pnm) pnm = lines.find(l=>l.includes('【')) || '';
  if(!qty) qty = '1';
  if(!order && !zip && !name) return null;
  const sp = splitJpAddress(addr);
  return {order, name, zip, addr, addr1:sp.addr1, addr2:sp.addr2, addr3:sp.addr3,
          tel:'', sku, fullname:pnm, variation:'', qty, source:'Amazon'};
}

// ===== 住所文字列を「都道府県+市区町村+町名 / 番地 / 建物」に自動分割 =====
// Amazon納品書PDFは住所が1本の文字列でしか取れないため、ここで分ける
function splitJpAddress(full){
  let s = String(full||'').replace(/[　\s]+/g,' ').trim();
  if(!s) return {addr1:'', addr2:'', addr3:''};

  // 都道府県
  const pm = s.match(/^(東京都|北海道|(?:京都|大阪)府|.{2,3}県)/);
  const pref = pm ? pm[1] : '';
  let rest = pref ? s.slice(pref.length) : s;

  // 市区町村（郡＋町村 / 政令市＋区 / 単独）
  let city = '';
  let m;
  if((m = rest.match(/^(.+?郡)(.+?[町村])/))){ city = m[1]+m[2]; }
  else if((m = rest.match(/^(.+?市)(.+?区)/))){ city = m[1]+m[2]; }
  else if((m = rest.match(/^(.+?[市区町村])/))){ city = m[1]; }
  rest = rest.slice(city.length);

  // 最初の数字までが町名、そこから先が番地＋建物
  const i = rest.search(/[0-9０-９]/);
  const town = i < 0 ? rest : rest.slice(0, i);
  let tail = i < 0 ? '' : rest.slice(i);

  // 番地は「数字・ハイフン・丁目番地号」だけで構成される先頭部分
  let banchi = tail, bldg = '';
  const bm = tail.match(/^[0-9０-９\-－ー‐−–の丁目番地号\s]+/);
  if(bm){ banchi = bm[0].trim(); bldg = tail.slice(bm[0].length).trim(); }

  return {
    addr1: (pref + city + town).trim(),
    addr2: banchi.trim(),
    addr3: bldg.trim()
  };
}

// find header row (contains 受取人 or 注文ID), data starts after description row
function parseSheet(aoa){
  let headerIdx = -1;
  for(let i=0;i<Math.min(aoa.length,5);i++){
    const row = aoa[i].map(x=>String(x).trim());
    if(row.includes('注文ID') && (row.includes('受取人')||row.includes('数量'))){ headerIdx=i; break; }
  }
  if(headerIdx<0) headerIdx=0;
  const header = aoa[headerIdx].map(x=>String(x).trim());
  const col = {};
  header.forEach((h,i)=>{ if(h && !(h in col)) col[h]=i; });
  const g=(row,name)=>{ const i=col[name]; return (i==null||row[i]==null)?'':String(row[i]).trim(); };

  // detect if row after header is a description row (row where 注文ID cell is a description sentence)
  let start = headerIdx+1;
  const idIdx = col['注文ID'];
  if(idIdx!=null){
    const first = String(aoa[start] ? aoa[start][idIdx] : '').trim();
    // real order IDs are long digit strings; description contains 。 or non-digits
    if(!/^\d{6,}$/.test(first)) start = headerIdx+2;
  }

  const out=[];
  for(let i=start;i<aoa.length;i++){
    const row = aoa[i];
    if(!row) continue;
    const order = g(row,'注文ID');
    if(!/^\d{6,}$/.test(order)) continue;
    const addr = ['都道府県','市区町村','町名','詳細住所1','詳細住所2']
      .map(k=>g(row,k)).filter(Boolean).join('');
    // 送り状FMT用の分割住所
    const addr1 = ['都道府県','市区町村','町名'].map(k=>g(row,k)).filter(Boolean).join('');
    const addr2 = g(row,'詳細住所1');
    const addr3 = g(row,'詳細住所2');
    out.push({
      order,
      name: g(row,'受取人'),
      zip: g(row,'郵便番号'),
      addr, addr1, addr2, addr3,
      tel: g(row,'電話番号'),
      sku: g(row,'セラーSKU'),
      fullname: g(row,'商品名'),
      variation: g(row,'バリエーション'),
      qty: g(row,'数量') || '1',
      source: 'TikTok',
    });
  }
  return out;
}

function shortName(r){
  // 登録済みSKUは短縮名。未登録は商品名フルにフォールバック
  let base = SKU_SHORT[r.sku] || r.fullname;
  const v = r.variation;
  if(v && v!=='デフォルト') base += ' ['+v+']';
  return base;
}
function fmtZip(z, hyphen){
  if(!z) return '';
  const d = z.replace(/[^0-9]/g,'');
  if(hyphen && d.length===7) return '〒'+d.slice(0,3)+'-'+d.slice(3);
  return '〒'+z;
}

function render(){
  let recs=[];
  filesData.forEach((f,fi)=>{
    const src = f.name.replace(/\.(xlsx|xls|csv|pdf)$/i,'');
    f.rows.forEach((r,ri)=>recs.push({...r, src, fileIdx:fi, rowIdx:ri, product:shortName(r)}));
  });

  if(!recs.length){
    currentRecs=[]; $('fmtBtn').disabled=true;
    $('output').style.display='none'; $('emptyMsg').style.display='block';
    $('emptyMsg').textContent='有効な注文データが見つかりませんでした。'; return;
  }

  // ファイル順（読み込んだ順・行順を保持）
  recs.sort((a,b)=> a.fileIdx-b.fileIdx || a.rowIdx-b.rowIdx);
  currentRecs = recs;

  const totalLines = recs.length;
  const totalQty = recs.reduce((s,r)=>s+(parseInt(r.qty)||1),0);

  // summary
  const summ = {};
  recs.forEach(r=>{ const k=r.src+''+r.product; summ[k]=(summ[k]||0)+(parseInt(r.qty)||1); });
  let sh='<table class="sumtbl"><thead><tr><th>ファイル</th><th>商品</th><th class="c">合計個数</th></tr></thead><tbody>';
  Object.keys(summ).forEach(k=>{ const [src,prod]=k.split('');
    sh+=`<tr><td>${esc(src)}</td><td>${esc(prod)}</td><td class="c">${summ[k]}</td></tr>`; });
  sh+='</tbody></table>';
  $('summary').innerHTML=sh;

  // 同一宛先（宛名＋〒＋住所）でまとめる（読み込み順を保持）
  const groups=[]; const gmap={};
  recs.forEach(r=>{
    const key=r.name+'|'+r.zip+'|'+r.addr;
    if(!(key in gmap)){ gmap[key]=groups.length; groups.push({name:r.name, zip:r.zip, addr:r.addr, items:[]}); }
    groups[gmap[key]].items.push(r);
  });

  // main table : No | 宛名 | 〒・住所 | 注文ID | 商品名 | 個数 | 追跡番号
  let th='<table><thead><tr><th class="c">No</th><th>宛名</th><th>〒・住所</th><th class="c">元</th><th>注文ID</th><th>商品名</th><th class="c">個数</th><th class="trackh">追跡番号</th></tr></thead><tbody>';
  groups.forEach((gp,gi)=>{
    const n=gp.items.length;
    const addr=(fmtZip(gp.zip,true)+' '+gp.addr).trim();
    gp.items.forEach((r,li)=>{
      th+= (li===0? '<tr class="grp">' : '<tr>');
      if(li===0){
        th+=`<td class="c" rowspan="${n}">${gi+1}</td>`+
            `<td rowspan="${n}">${esc(gp.name)}</td>`+
            `<td rowspan="${n}">${esc(addr)}</td>`;
      }
      th+=`<td class="c src">${esc(r.source==='Amazon'?'AMZ':'TT')}</td>`+
           `<td class="ord">${esc(r.order)}</td><td>${esc(r.product)}</td><td class="c">${esc(r.qty)}</td>`;
      if(li===0) th+=`<td class="track" rowspan="${n}"></td>`;
      th+='</tr>';
    });
  });
  th+='</tbody></table>';
  $('listTable').innerHTML=th;

  const today=new Date().toLocaleDateString('ja-JP');
  $('meta').textContent=`作成日: ${today}　／　発送先: ${groups.length} 件　明細: ${totalLines} 件　総個数: ${totalQty} 個　（読込ファイル: ${filesData.map(f=>f.name).join(', ')}）`;

  $('emptyMsg').style.display='none';
  $('output').style.display='block';
  $('printBtn').disabled=false;
  $('fmtBtn').disabled=false;
}

/* ===== 送り状フォーマット（CSV）出力 ===== */

// --- 汎用テンプレ（スプレッドシート「手入力」シート）の列順 ---
const GENERIC_HEADER = ['配送方法','郵便番号','お届け先氏名','敬称',
  '住所1行目（都道府県・市区町村）','住所2行目（番地）','住所3行目（建物・部屋番号）',
  '住所4行目（任意）','電話番号（佐川は必須）','内容品','出力ステータス'];

// --- クリックポスト 公式CSVの列順（この文字列を1文字でも変えると取込エラーになる） ---
const CLICKPOST_HEADER = ['お届け先郵便番号','お届け先氏名','お届け先敬称',
  'お届け先住所1行目','お届け先住所2行目','お届け先住所3行目','お届け先住所4行目','内容品'];

const CP_MAX_ROWS = 40;   // 1ファイルあたりの上限件数
const CP_MAX_LEN  = 20;   // 各住所欄・氏名・内容品の上限文字数

// 郵便番号：半角数字7桁（ハイフンなし）
function fmtZipPlain(z){
  return toHalf(String(z||'')).replace(/[^0-9]/g,'');
}

// 全角英数字・記号を半角へ
function toHalf(s){
  return String(s||'').replace(/[！-～]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
                      .replace(/　/g,' ');
}

// 電話番号：(+81)09012345678 → 09012345678
function fmtTel(t){
  let s = toHalf(t).replace(/[^0-9+]/g,'');
  s = s.replace(/^\+?81/,'').replace(/[^0-9]/g,'');
  if(!s) return '';
  if(s[0]!=='0') s = '0'+s;
  return s;
}

// 内容品：短縮商品名（個数2以上なら ×n）
// 未登録SKUは商品名から【…】を除き、先頭の語だけを使って短くする
function contentName(r){
  if(SKU_SHORT[r.sku]) return SKU_SHORT[r.sku];
  let s = String(r.fullname||'').replace(/【[^】]*】/g,'').replace(/[（(].*?[)）]/g,'');
  s = s.replace(/[　\s]+/g,' ').trim();
  const first = s.split(' ').filter(Boolean).slice(0,2).join(' ');
  return (first || s || '雑貨');
}
function fmtContent(r){
  const q = parseInt(r.qty)||1;
  let base = contentName(r).trim();
  const v = r.variation;
  if(v && v!=='デフォルト') base += ' '+v;
  return q>1 ? `${base}×${q}` : base;
}

// 住所を4欄に詰める。各欄 CP_MAX_LEN 文字以内になるよう貪欲に詰め、
// 1要素が長すぎる場合は分割する
function packAddress(r, maxLen){
  const segs = [
    (r.addr1 || r.addr || ''),   // 都道府県＋市区町村＋町名
    (r.addr2 || ''),             // 番地
    (r.addr3 || '')              // 建物・部屋番号
  ].map(x=>String(x).trim()).filter(Boolean);

  // 長すぎる要素は maxLen ごとに割る
  const chunks=[];
  segs.forEach(seg=>{
    while(seg.length > maxLen){ chunks.push(seg.slice(0,maxLen)); seg = seg.slice(maxLen); }
    if(seg) chunks.push(seg);
  });

  // 4欄に収まるなら「都道府県市区町村町名 / 番地 / 建物」の並びをそのまま活かす
  let lines;
  if(chunks.length <= 4){
    lines = chunks.slice();
  }else{
    // 収まらない場合だけ、前の欄に詰めて4欄に寄せる
    lines=[];
    chunks.forEach(seg=>{
      if(lines.length && (lines[lines.length-1]+seg).length <= maxLen) lines[lines.length-1] += seg;
      else lines.push(seg);
    });
  }
  const overflow = lines.length > 4 ? lines.slice(4) : [];
  while(lines.length < 4) lines.push('');
  return {lines: lines.slice(0,4), overflow};
}

function csvCell(v){
  const s = String(v==null?'':v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows){
  return rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n';
}

// --- クリックポスト用の行を作る（警告も同時に集める） ---
function buildClickpostRows(recs){
  const rows=[]; const warns=[];
  recs.forEach(r=>{
    const zip = fmtZipPlain(r.zip);
    const {lines, overflow} = packAddress(r, CP_MAX_LEN);
    let name = String(r.name||'').trim();
    let content = fmtContent(r) || '雑貨';

    if(zip.length!==7) warns.push(`${r.order}：郵便番号が7桁ではありません（${r.zip||'空欄'}）`);
    if(!name) warns.push(`${r.order}：お届け先氏名が空欄です`);
    if(name.length > CP_MAX_LEN){ warns.push(`${r.order}：氏名が${CP_MAX_LEN}文字を超えるため切り詰めました（${name}）`); name = name.slice(0,CP_MAX_LEN); }
    if(content.length > CP_MAX_LEN){ warns.push(`${r.order}：内容品が${CP_MAX_LEN}文字を超えるため切り詰めました（${content}）`); content = content.slice(0,CP_MAX_LEN); }
    if(overflow.length) warns.push(`${r.order}：住所が4欄に収まらず末尾を切り捨てました（${overflow.join(' / ')}）`);

    rows.push([zip, name, '様', lines[0], lines[1], lines[2], lines[3], content]);
  });
  return {rows, warns};
}

function buildGenericRows(recs, methodLabel){
  const rows=[], warns=[];
  recs.forEach(r=>{
    const zip = fmtZipPlain(r.zip);
    const tel = fmtTel(r.tel);
    if(zip.length!==7) warns.push(`${r.order}：郵便番号が7桁ではありません（${r.zip||'空欄'}）`);
    if(!String(r.name||'').trim()) warns.push(`${r.order}：お届け先氏名が空欄です`);
    if(methodLabel==='佐川急便' && !tel){
      warns.push(`${r.order}：電話番号がありません（佐川は必須）${r.source==='Amazon'?'／Amazon納品書PDFには電話番号が印字されないため手入力が必要です':''}`);
    }
    if(!r.addr2 && r.source==='Amazon') warns.push(`${r.order}：番地を自動判別できませんでした（住所1行目に丸ごと入っています）`);
    rows.push([
      methodLabel, zip, r.name||'', '様',
      r.addr1||r.addr||'', r.addr2||'', r.addr3||'', '',
      tel, fmtContent(r), ''
    ]);
  });
  return {rows, warns};
}

function downloadCSV(text, filename, enc){
  let blob;
  if(enc==='sjis' && window.Encoding){
    const sjis = Encoding.convert(Encoding.stringToCode(text), {to:'SJIS', from:'UNICODE'});
    blob = new Blob([new Uint8Array(sjis)], {type:'text/csv'});
  }else{
    blob = new Blob(['﻿'+text], {type:'text/csv;charset=utf-8'});
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

function showWarn(html, ok){
  const el=$('fmtWarn');
  el.className = 'fmtwarn'+(ok?' ok':'');
  el.innerHTML = html;
  el.style.display='block';
}

function exportFmt(){
  if(!currentRecs.length){ alert('先に「リストを作成」してください。'); return; }
  const mode = $('fmtMode').value;
  let enc = $('csvEnc').value;
  if(enc==='sjis' && !window.Encoding){
    alert('Shift_JIS変換ライブラリが読み込めなかったため、UTF-8（BOM付き）で出力します。');
    enc = 'utf8';
  }
  const ts = stamp();
  const amazonCount = currentRecs.filter(r=>r.source==='Amazon').length;

  if(mode==='clickpost'){
    if(enc!=='sjis' && !confirm('クリックポストの取込はShift_JIS指定です。UTF-8のまま出力しますか？')) return;

    const {rows, warns} = buildClickpostRows(currentRecs);
    const chunks=[];
    for(let i=0;i<rows.length;i+=CP_MAX_ROWS) chunks.push(rows.slice(i,i+CP_MAX_ROWS));
    chunks.forEach((chunk,i)=>{
      const csv = toCSV([CLICKPOST_HEADER, ...chunk]);
      const suffix = chunks.length>1 ? `_${i+1}` : '';
      setTimeout(()=>downloadCSV(csv, `クリックポスト_${ts}${suffix}.csv`, enc), i*400);
    });
    let html = `<b>クリックポスト用CSVを${chunks.length}ファイル出力しました（合計 ${rows.length} 件）</b>`;
    if(chunks.length>1) html += `1ファイル${CP_MAX_ROWS}件までのため分割しています。<br>`;
    if(amazonCount) html += `Amazon納品書PDFから ${amazonCount} 件を含みます。住所は自動分割のため、下の一覧で分かれ方をご確認ください。<br>`;
    if(warns.length){
      html += `要確認 ${warns.length} 件：<br>・` + warns.map(esc).join('<br>・');
      showWarn(html, false);
    }else{
      html += 'ヘッダー・文字コード（Shift_JIS）・住所20文字以内をすべて満たしています。';
      showWarn(html, true);
    }
    return;
  }

  // --- 手入力シート貼付用（11列） ---
  const method = $('shipMethod').value;
  const {rows, warns} = buildGenericRows(currentRecs, method);
  const csv = toCSV([GENERIC_HEADER, ...rows]);
  downloadCSV(csv, `送り状FMT_${method}_${ts}.csv`, enc);

  let html = `<b>手入力シート貼付用CSVを ${rows.length} 件出力しました（配送方法: ${esc(method)}）</b>`;
  html += 'スプレッドシート「手入力」シートの2行目から貼り付けてください。<br>';
  if(warns.length){
    html += `要確認 ${warns.length} 件：<br>・` + warns.map(esc).join('<br>・');
    showWarn(html, false);
  }else{
    showWarn(html, true);
  }
}

const FMT_NOTES = {
  clickpost: 'クリックポスト公式CSV（8列 / Shift_JIS / 1ファイル40件まで / 住所各欄20文字以内）で出力します。ヘッダー行はそのまま残してアップロードしてください。',
  generic: 'スプレッドシート「手入力」シートと同じ11列（配送方法〜出力ステータス）で出力します。佐川はここから伝票を作成してください。'
};
function updateFmtNote(){
  const mode=$('fmtMode').value;
  $('fmtNote').textContent = FMT_NOTES[mode]||'';
  $('methodWrap').style.display = (mode==='generic') ? '' : 'none';
  $('csvEnc').value = (mode==='clickpost') ? 'sjis' : 'utf8';
  $('fmtWarn').style.display='none';
}
$('fmtMode').addEventListener('change', updateFmtNote);
updateFmtNote();

function renderFileList(){
  const el=$('fileList');
  if(!filesData.length){ el.innerHTML=''; return; }
  el.innerHTML = filesData.map((f,i)=>
    `<span class="f">📄 ${esc(f.name)} <small>(${f.rows.length}件)</small> <button data-i="${i}" title="削除">×</button></span>`
  ).join('');
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
    filesData.splice(+e.target.dataset.i,1); renderFileList();
    if(filesData.length) render(); else $('clearBtn').click();
  }));
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
